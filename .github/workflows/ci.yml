name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/clean-up-codebase

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.14

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Sync project
        run: uv sync --locked --all-groups

      - name: Run project gate
        run: make check
