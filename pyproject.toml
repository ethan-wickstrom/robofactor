[project]
name = "robofactor"
version = "0.1.1"
description = "The robot who refactors: /[^_^]\\"
readme = "README.md"
authors = [{ name = "ethan-wickstrom", email = "e.t.wickstrom@wustl.edu" }]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "typer>=0.26.7",
  "rich>=15.0.0",
  "dspy-ai>=3.2.1",
  "mlflow>=3.13.0",
  "beartype>=0.22.9",
  "returns>=0.28.0",
  "rope>=1.14.0",
  "pydantic>=2.13.4",
  "hypothesis>=6.155.2",
  "ruff>=0.15.16",
  "ty>=0.0.44",
]

[project.urls]
Homepage = "https://github.com/ethan-wickstrom/robofactor"
Repository = "https://github.com/ethan-wickstrom/robofactor.git"
Issues = "https://github.com/ethan-wickstrom/robofactor/issues"
Documentation = "https://github.com/ethan-wickstrom/robofactor#readme"

[project.scripts]
robofactor = "robofactor.main:app"

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mutmut>=3.5.0",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "tach>=0.35.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
  "mutants",
  "optimized",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # pep8-naming
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "RUF",  # ruff-specific rules
  "C901", # McCabe complexity
  "C4",   # comprehension quality
  "SIM",  # simplify control flow
  "RET",  # return statement clarity
  "ARG",  # unused arguments
  "PIE",  # small correctness and style issues
  "PLC",  # Pylint conventions
  "PLE",  # Pylint errors
  "PLW",  # Pylint warnings
]
ignore = [
  "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # allow assert in tests

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.environment]
python-version = "3.14"
python-platform = "all"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=robofactor",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
]
testpaths = ["tests"]
pythonpath = ["src"]
python_classes = ["Test*[!e]"]

[tool.coverage.run]
source = ["src/robofactor"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.mutmut]
source_paths = ["src/robofactor"]
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = ["-p", "no:tach"]
mutate_only_covered_lines = true
use_setproctitle = false
