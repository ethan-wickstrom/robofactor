[project]
name = "robofactor"
version = "0.1.1"
description = "The robot who refactors: /[^_^]\\"
readme = "README.md"
authors = [{ name = "ethan-wickstrom", email = "e.t.wickstrom@wustl.edu" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "typer>=0.16.0",
  "rich>=13.7.1",
  "dspy-ai>=3",
  "mlflow>=3.1.0",
  "beartype>=0.21.0",
  "returns>=0.26.0",
  "gepa>=0.0.7",
]

[project.urls]
Homepage = "https://github.com/ethan-wickstrom/robofactor"
Repository = "https://github.com/ethan-wickstrom/robofactor.git"
Issues = "https://github.com/ethan-wickstrom/robofactor/issues"
Documentation = "https://github.com/ethan-wickstrom/robofactor#readme"

[project.scripts]
robofactor = "robofactor.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/robofactor",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "ty>=0.0.1a22",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "RUF", # ruff-specific rules
  "C90", # mccabe complexity (C901)
]
ignore = [
  "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # allow assert in tests

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=robofactor",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
]
testpaths = ["tests"]
pythonpath = ["src"]
python_classes = ["Test*[!e]"]

[tool.coverage.run]
source = ["src/robofactor"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
